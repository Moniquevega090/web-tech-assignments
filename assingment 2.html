<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Scramble</title>
<style>
  body { font-family: Arial, sans-serif; background: #f0f4f8; display: flex; justify-content: center; padding-top: 60px; }
  .box { background: white; padding: 30px 40px; border-radius: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.15); text-align: center; width: 320px; }
  #scrambled { font-size: 32px; letter-spacing: 6px; margin: 20px 0; color: #2b6cb0; }
  input { padding: 10px; font-size: 16px; width: 80%; text-align: center; }
  button { margin-top: 12px; padding: 10px 20px; font-size: 16px; background: #2b6cb0; color: white; border: none; border-radius: 6px; cursor: pointer; }
  #message { margin-top: 15px; min-height: 24px; font-weight: bold; }
</style>
</head>
<body>
<div class="box">
  <h2>Word Scramble</h2>
  <p>Round <span id="round">1</span> / 5 &nbsp;|&nbsp; Score: <span id="score">0</span></p>
  <div id="scrambled"></div>
  <input type="text" id="guess" placeholder="Your answer" autocomplete="off">
  <br>
  <button id="submit">Check</button>
  <div id="message"></div>
</div>

<script>
  const words = ["python", "laptop", "network", "keyboard", "student", "monitor", "program"];
  const totalRounds = 5;
  let round = 1, score = 0, currentWord = "";

  function scramble(word) {
    let result;
    do {
      result = word.split("").sort(() => Math.random() - 0.5).join("");
    } while (result === word);
    return result;
  }

  function newRound() {
    currentWord = words[Math.floor(Math.random() * words.length)];
    document.getElementById("scrambled").textContent = scramble(currentWord);
    document.getElementById("round").textContent = round;
    document.getElementById("guess").value = "";
    document.getElementById("guess").focus();
  }

  function checkGuess() {
    const guess = document.getElementById("guess").value.toLowerCase().trim();
    const msg = document.getElementById("message");

    if (guess === currentWord) {
      score++;
      msg.textContent = "Correct!";
      msg.style.color = "green";
    } else {
      msg.textContent = "Wrong! The word was: " + currentWord;
      msg.style.color = "red";
    }
    document.getElementById("score").textContent = score;

    if (round === totalRounds) {
      document.getElementById("scrambled").textContent = "Game over!";
      msg.textContent += ` You scored ${score}/${totalRounds}`;
      document.getElementById("submit").textContent = "Play again";
      document.getElementById("submit").onclick = () => location.reload();
      return;
    }
    round++;
    setTimeout(() => { msg.textContent = ""; newRound(); }, 1200);
  }

  document.getElementById("submit").onclick = checkGuess;
  document.getElementById("guess").addEventListener("keydown", e => {
    if (e.key === "Enter") document.getElementById("submit").click();
  });

  newRound();
</script>
</body>
</html>
